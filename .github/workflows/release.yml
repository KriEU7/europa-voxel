# Every push on main: tests, then the game is built for Windows, macOS and Linux
# (one file each) and published as a new GitHub release. Nobody has to build by hand.
name: Build & release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'screenshots/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # No install scripts: the Electron/voice-generator downloads are not needed to build.
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: game-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message || 'manual run' }}
        run: |
          TAG="v$(node -p "require('./package.json').version")-build.${{ github.run_number }}"
          FIRST="$(echo "$MSG" | head -n 1)"
          cat > notes.md <<EOF
          Automatic build of \`${GITHUB_SHA::7}\`: $FIRST

          | System | File |
          |---|---|
          | Windows | \`.exe\` – double click, no install |
          | macOS (Intel + Apple Silicon) | \`.dmg\` – first time: right click on the app → Open |
          | Linux | \`.AppImage\` – make it executable, then double click |
          EOF
          gh release create "$TAG" out/* --title "Europa Voxel $TAG" --notes-file notes.md --target "$GITHUB_SHA"
